name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: song-trainer/package-lock.json
      - name: Install dependencies
        working-directory: song-trainer
        run: npm ci
      - name: Generate fixtures
        working-directory: song-trainer
        run: npm run fixtures
      - name: Type check
        working-directory: song-trainer
        run: npm run typecheck
      - name: Lint
        working-directory: song-trainer
        run: npm run lint
      - name: Test
        working-directory: song-trainer
        run: npm test
      - name: Build
        working-directory: song-trainer
        run: npm run build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Check formatting
        working-directory: song-trainer/src-tauri
        run: cargo fmt --all -- --check
      - name: Run tests
        working-directory: song-trainer/src-tauri
        run: cargo test --all-targets
      - name: Check compilation
        working-directory: song-trainer/src-tauri
        run: cargo check

  windows-build:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, rust-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: song-trainer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: song-trainer
        run: npm ci
      - name: Generate fixtures
        working-directory: song-trainer
        run: npm run fixtures
      - name: Build Tauri app
        working-directory: song-trainer
        run: npx tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-song-trainer-windows
          path: song-trainer/src-tauri/target/release/bundle/nsis/*.exe
